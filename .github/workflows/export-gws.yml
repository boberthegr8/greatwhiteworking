name: Export GWS Source

on:
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: gws-site-source
          path: gws-site
          include-hidden-files: true
          retention-days: 1
